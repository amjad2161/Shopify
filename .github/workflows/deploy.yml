name: Deploy

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy-oxygen:
    name: Deploy to Shopify Oxygen
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Deploy Hydrogen storefront
        env:
          SHOPIFY_HYDROGEN_DEPLOYMENT_TOKEN: ${{ secrets.SHOPIFY_HYDROGEN_DEPLOYMENT_TOKEN }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          PUBLIC_STORE_DOMAIN: ${{ secrets.PUBLIC_STORE_DOMAIN }}
          PUBLIC_STOREFRONT_API_TOKEN: ${{ secrets.PUBLIC_STOREFRONT_API_TOKEN }}
        run: |
          if [ -z "${SHOPIFY_HYDROGEN_DEPLOYMENT_TOKEN}" ]; then
            echo "::notice::SHOPIFY_HYDROGEN_DEPLOYMENT_TOKEN not configured — skipping Oxygen deploy."
            exit 0
          fi
          if [ -z "${SESSION_SECRET}" ] || [ -z "${PUBLIC_STORE_DOMAIN}" ] || [ -z "${PUBLIC_STOREFRONT_API_TOKEN}" ]; then
            echo "::notice::Store secrets missing — skipping Oxygen deploy."
            exit 0
          fi
          npm exec shopify -- hydrogen deploy --auth-bypass-token "${SHOPIFY_HYDROGEN_DEPLOYMENT_TOKEN}"
