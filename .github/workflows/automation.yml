name: Automation

on:
  push:
    branches: [main, 'cursor/**']
  pull_request:
    branches: [main]

concurrency:
  group: automation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  automate:
    name: Full automation pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run automation (CI mode)
        run: npm run automate:ci

      - name: Upload automation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: automation-report
          path: .automation/reports/latest.json
          if-no-files-found: ignore

  store-build:
    name: Production build (live store)
    runs-on: ubuntu-latest
    needs: automate
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Production build
        env:
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          PUBLIC_STORE_DOMAIN: ${{ secrets.PUBLIC_STORE_DOMAIN }}
          PUBLIC_STOREFRONT_API_TOKEN: ${{ secrets.PUBLIC_STOREFRONT_API_TOKEN }}
        run: |
          if [ -z "${SESSION_SECRET}" ] || [ -z "${PUBLIC_STORE_DOMAIN}" ] || [ -z "${PUBLIC_STOREFRONT_API_TOKEN}" ]; then
            echo "::notice::Store secrets not configured — skipping production build."
            exit 0
          fi
          cat > .env <<EOF
          SESSION_SECRET=${SESSION_SECRET}
          PUBLIC_STORE_DOMAIN=${PUBLIC_STORE_DOMAIN}
          PUBLIC_STOREFRONT_API_TOKEN=${PUBLIC_STOREFRONT_API_TOKEN}
          PUBLIC_3D_EXPERIENCE=1
          PUBLIC_BRAND_NAME=OneClick Hub
          EOF
          npm run build

  store-e2e:
    name: Playwright E2E (live store)
    runs-on: ubuntu-latest
    needs: automate
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run immersive E2E
        env:
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          PUBLIC_STORE_DOMAIN: ${{ secrets.PUBLIC_STORE_DOMAIN }}
          PUBLIC_STOREFRONT_API_TOKEN: ${{ secrets.PUBLIC_STOREFRONT_API_TOKEN }}
        run: |
          if [ -z "${SESSION_SECRET}" ] || [ -z "${PUBLIC_STORE_DOMAIN}" ] || [ -z "${PUBLIC_STOREFRONT_API_TOKEN}" ]; then
            echo "::notice::Store secrets not configured — skipping Playwright E2E."
            exit 0
          fi
          cat > .env <<EOF
          SESSION_SECRET=${SESSION_SECRET}
          PUBLIC_STORE_DOMAIN=${PUBLIC_STORE_DOMAIN}
          PUBLIC_STOREFRONT_API_TOKEN=${PUBLIC_STOREFRONT_API_TOKEN}
          PUBLIC_3D_EXPERIENCE=1
          PUBLIC_BRAND_NAME=OneClick Hub
          EOF
          npm run test:e2e
